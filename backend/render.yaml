services:
  - type: web
    name: startup-funding-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ENRICH_WORKERS
        value: "6"
      - key: BRAVE_SEARCH_API_KEY
        sync: false
