[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-funding-collector"
version = "0.1.0"
description = "Collect funded startup and funding-round data into Supabase"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
startup-scraper = "startup_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["startup_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

